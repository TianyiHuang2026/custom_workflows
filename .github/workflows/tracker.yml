
name: GitHub Projects Automation
# Test automatic Issue status update
on:
  pull_request:
    types: [closed]

jobs:
  move-issue-to-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Find linked issues and update Project status
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: TianyiHuang2026
          PROJECT_NUMBER: "1"
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Finding issues closed by the merged PR..."

          ISSUES=$(gh api graphql \
            -f query='
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 50) {
                      nodes {
                        id
                        number
                      }
                    }
                  }
                }
              }' \
            -f owner="$REPO_OWNER" \
            -f repo="$REPO_NAME" \
            -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes')

          if [ "$(echo "$ISSUES" | jq 'length')" -eq 0 ]; then
            echo "No linked closing issues found. Make sure the PR description includes Closes #ISSUE_NUMBER."
            exit 0
          fi

          PROJECT=$(gh api graphql \
            -f query='
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }' \
            -f owner="$PROJECT_OWNER" \
            -F number="$PROJECT_NUMBER")

          PROJECT_ID=$(echo "$PROJECT" | jq -r '.data.user.projectV2.id')
          STATUS_FIELD_ID=$(echo "$PROJECT" | jq -r \
            '.data.user.projectV2.fields.nodes[] | select(.name == "Status") | .id' | head -n 1)
          DONE_OPTION_ID=$(echo "$PROJECT" | jq -r \
            '.data.user.projectV2.fields.nodes[] | select(.name == "Status") | .options[] | select(.name == "Done") | .id' | head -n 1)

          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ] || \
             [ -z "$STATUS_FIELD_ID" ] || [ -z "$DONE_OPTION_ID" ]; then
            echo "Could not find the Project, Status field, or Done option."
            exit 1
          fi

          echo "$ISSUES" | jq -c '.[]' | while read -r issue; do
            ISSUE_ID=$(echo "$issue" | jq -r '.id')
            ISSUE_NUMBER=$(echo "$issue" | jq -r '.number')

            ITEM_ID=$(echo "$PROJECT" | jq -r \
              --arg issue_id "$ISSUE_ID" \
              '.data.user.projectV2.items.nodes[] | select(.content.id == $issue_id) | .id' | head -n 1)

            if [ -z "$ITEM_ID" ]; then
              echo "Issue #$ISSUE_NUMBER is not in Project #$PROJECT_NUMBER; skipping."
              continue
            fi

            gh api graphql \
              -f query='
                mutation(
                  $project: ID!,
                  $item: ID!,
                  $field: ID!,
                  $option: String!
                ) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $project,
                      itemId: $item,
                      fieldId: $field,
                      value: { singleSelectOptionId: $option }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }' \
              -f project="$PROJECT_ID" \
              -f item="$ITEM_ID" \
              -f field="$STATUS_FIELD_ID" \
              -f option="$DONE_OPTION_ID" >/dev/null

            echo "Issue #$ISSUE_NUMBER moved to Done."
          done
